<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F3D2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DCC4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Base: Forest Green -->
  <rect width="1200" height="630" fill="#1F3D2B"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>

  <!-- Subtle Matrix Grid Lines -->
  <g stroke="url(#gridGrad)" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- Branded Badge Pill -->
  <g transform="translate(100, 110)">
    <rect width="240" height="40" rx="20" fill="#8B5CF6" fill-opacity="0.18" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="5" fill="#8B5CF6"/>
    <text x="36" y="25" fill="#E8DCC4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">AI PRODUCT VALIDATION</text>
  </g>

  <!-- Main Headline Typography -->
  <text x="100" y="240" fill="#E8DCC4" font-family="Georgia, serif" font-size="76" font-weight="700" letter-spacing="-1.5">
    Every idea has a
  </text>
  <text x="100" y="325" fill="#8B5CF6" font-family="Georgia, serif" font-size="76" font-style="italic" font-weight="700" letter-spacing="-1.5">
    blindspot.
  </text>

  <!-- Subheadline -->
  <text x="100" y="405" fill="#E8DCC4" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Intelligent validation engine for student founders and early-stage teams.
  </text>
  <text x="100" y="445" fill="#E8DCC4" fill-opacity="0.65" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">
    Deconstruct hypotheses • Uncover lethal risks • Synthesize non-leading customer feedback
  </text>

  <!-- Bottom Brand Footer -->
  <g transform="translate(100, 520)">
    <circle cx="16" cy="16" r="16" fill="#8B5CF6"/>
    <circle cx="16" cy="16" r="6" fill="#1F3D2B"/>
    <text x="44" y="22" fill="#E8DCC4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="1">BLINDSPOT AI</text>
    <text x="960" y="22" fill="#E8DCC4" fill-opacity="0.6" font-family="monospace" font-size="16">blindspot-ai.com</text>
  </g>
</svg>
