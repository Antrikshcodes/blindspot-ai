# This is a baseline CI workflow. It will be extended once the tech stack is finalized.

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .env files (security check)
        run: |
          echo "🔍 Scanning for .env files..."
          if find . -name ".env" -not -path "./.git/*" | grep -q "."; then
            echo "❌ ERROR: .env file(s) detected in the repository!"
            echo "Please remove .env files and add them to .gitignore."
            find . -name ".env" -not -path "./.git/*"
            exit 1
          fi
          echo "✅ No .env files found."

      - name: Validate essential markdown files exist
        run: |
          echo "📄 Checking for essential documentation files..."
          missing=0
          for file in README.md CONTRIBUTING.md LICENSE; do
            if [ -f "$file" ]; then
              echo "  ✅ $file exists"
            else
              echo "  ⚠️  $file is missing (expected but not required to pass CI)"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "⚠️  $missing file(s) missing — consider adding them."
          else
            echo "✅ All essential markdown files are present."
          fi

      - name: Check folder structure exists
        run: |
          echo "📁 Checking project folder structure..."
          for dir in frontend backend docs; do
            if [ -d "$dir" ]; then
              echo "  ✅ $dir/ exists"
            else
              echo "  ⚠️  $dir/ is missing (expected but not required to pass CI)"
            fi
          done
          echo "✅ Folder structure check complete."

      - name: Print success message
        run: |
          echo "============================================"
          echo "🎉 CI Pipeline — All Quality Checks Passed!"
          echo "============================================"
          echo ""
          echo "Project: Blindspot AI"
          echo "Build:   CoNSTruct 2.0 (Replit × Newton School of Technology)"
          echo ""
          echo "All checks completed successfully."
