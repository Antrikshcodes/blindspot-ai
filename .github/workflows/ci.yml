name: Blindspot AI CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Type check and build backend
        working-directory: backend
        run: npm run build

      - name: Run Phase 01 Vitest suite
        working-directory: backend
        run: npm test

      - name: Generate Prisma client for retained legacy backend
        working-directory: backend
        run: npm run prisma:generate

      - name: Verify legacy backend build compatibility
        working-directory: backend
        run: npm run build:legacy

  frontend-quality:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and bundle production assets
        run: pnpm --filter blindspot-ai-frontend build

      - name: Run frontend unit & integration tests
        run: pnpm --filter blindspot-ai-frontend test

  container-build:
    name: Container Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t blindspot-ai-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t blindspot-ai-frontend:ci .

  security-compliance:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for committed secrets and .env files
        run: |
          echo "🔍 Scanning working tree for forbidden environment and credential files..."
          if find . -maxdepth 3 -name ".env*" -not -name "*.example" -not -path "./.git/*" | grep -q "."; then
            echo "❌ ERROR: Unsafe environment file detected!"
            find . -maxdepth 3 -name ".env*" -not -name "*.example" -not -path "./.git/*"
            exit 1
          fi
          echo "✅ No sensitive .env files detected."

      - name: Validate documentation structure
        run: |
          echo "📄 Verifying required operational guides..."
          for doc in \
            docs/QA_AUDIT_REPORT.md \
            docs/SECURITY_AUDIT.md \
            docs/PERFORMANCE_REPORT.md \
            docs/PRODUCTION_ARCHITECTURE.md \
            docs/DATABASE_PRODUCTION_GUIDE.md; do
            if [ -f "$doc" ]; then
              echo "  ✅ $doc is present"
            else
              echo "  ❌ Missing required documentation: $doc"
              exit 1
            fi
          done
          echo "✅ All required operational guides exist."
