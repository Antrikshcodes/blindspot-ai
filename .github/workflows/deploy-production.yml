name: Production Deployment & Health Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migration step (true/false)'
        required: false
        default: 'false'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install and verify builds
        run: |
          npm --prefix backend ci
          npm --prefix backend run build
          pnpm install --frozen-lockfile
          pnpm --filter blindspot-ai-frontend build

  migrate-database:
    name: Apply Safe Schema Migrations
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_migrations != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Execute production migrations
        working-directory: backend
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm run db:migrate:prod
          else
            echo "⚠️ DATABASE_URL secret not configured in repository; skipping migration step."
          fi

  deploy-backend:
    name: Deploy Backend API
    needs: migrate-database
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloud Provider
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render deploy webhook..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "🚀 Triggering Railway deployment..."
            npx @railway/cli up --service blindspot-api
          else
            echo "ℹ️ No cloud deployment token configured; manual provider sync active."
          fi

  deploy-frontend:
    name: Deploy Frontend SPA
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter blindspot-ai-frontend build

      - name: Deploy to Vercel (if configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel --prod --token "$VERCEL_TOKEN"
          else
            echo "ℹ️ VERCEL_TOKEN not configured; automatic Git integration or manual upload active."
          fi

  verify-production-health:
    name: Verify Production Health Probe
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Probe Health Endpoint
        env:
          PROD_BACKEND_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -n "$PROD_BACKEND_URL" ]; then
            echo "🔍 Probing $PROD_BACKEND_URL/health..."
            curl --retry 5 --retry-delay 5 --fail -s "$PROD_BACKEND_URL/health" || echo "⚠️ Backend probe timed out or not yet ready."
          else
            echo "ℹ️ PROD_BACKEND_URL not set; skipping live health check."
          fi
