name: Production Deployment & Health Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migration step (true/false)'
        required: false
        default: 'false'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install and verify builds
        run: |
          npm --prefix backend ci
          npm --prefix backend run build
          pnpm install --frozen-lockfile
          pnpm --filter blindspot-ai-frontend build

  migrate-database:
    name: Apply Safe Schema Migrations
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_migrations != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Execute production migrations
        working-directory: backend
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm run db:migrate:prod
          else
            echo "::error::DATABASE_URL is required unless the workflow is explicitly dispatched with skip_migrations=true."
            exit 1
          fi

  deploy-backend:
    name: Deploy Backend API
    needs: [validate, migrate-database]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate.result == 'success' &&
      (needs.migrate-database.result == 'success' || github.event.inputs.skip_migrations == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloud Provider
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render deploy webhook..."
            curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "🚀 Triggering Railway deployment..."
            npx --yes @railway/cli up --service blindspot-api
          else
            echo "::error::Configure RENDER_DEPLOY_HOOK or RAILWAY_TOKEN before deploying the backend."
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend SPA
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo "::error::VITE_CLERK_PUBLISHABLE_KEY is required to build the authenticated frontend."; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL is required to build the frontend against the deployed API."; exit 1; }
          pnpm install --frozen-lockfile
          pnpm --filter blindspot-ai-frontend build

      - name: Deploy to Vercel (if configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is required for a manual production deployment."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID is required for a manual production deployment."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID is required for a manual production deployment."; exit 1; }
          npx --yes vercel --prod --token "$VERCEL_TOKEN"

  verify-production-health:
    name: Verify Production Health Probe
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Probe Health Endpoint
        env:
          PROD_BACKEND_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          test -n "$PROD_BACKEND_URL" || { echo "::error::VITE_API_BASE_URL must identify the deployed backend before health verification."; exit 1; }
          PROD_BACKEND_URL="${PROD_BACKEND_URL%/}"
          echo "🔍 Probing $PROD_BACKEND_URL/health..."
          curl --retry 5 --retry-delay 5 --fail --show-error --silent "$PROD_BACKEND_URL/health"
